<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Gedinfo Piacenza - AR Experience</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR per A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      
      /* FORZA IL NASCONDIMENTO DELLA ROTELLA D'ATTESA DI MINDAR */
      .mindar-ui-loading {
        display: none !important;
      }
      .mindar-ui-overlay {
        display: none !important;
      }

      /* Messaggio personalizzato */
      #scanning-overlay {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        z-index: 9999;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scanning-overlay">Inquadra il logo Gedinfo per attivare l'AR</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; uiScanning: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .clickable"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane
          class="clickable"
          id="ar-button"
          position="0 0 0"
          height="0.4"
          width="1.0"
          color="#0055A5"
          material="opacity: 0.9; transparent: true"
        >
          <a-text
            value="Vai al sito Gedinfo"
            align="center"
            color="#FFFFFF"
            width="2.5"
            position="0 0 0.01"
          ></a-text>
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      // Verifica se il file targets.mind è scaricabile
      fetch("./targets.mind")
        .then(response => {
          if (!response.ok) {
            alert("ERRORE: Il file targets.mind non è stato trovato su GitHub! Controlla la cartella.");
          }
        })
        .catch(err => {
          alert("Impossibile caricare il file targets.mind");
        });

      document.addEventListener("DOMContentLoaded", () => {
        const arButton = document.querySelector("#ar-button");
        if (arButton) {
          arButton.addEventListener("click", () => {
            window.location.href = "https://www.gedinfo.it/";
          });
        }
      });
    </script>
  </body>
</html>
